# Глобальные настройки — действуют на все джобы, если не переопределены
global:
  # как часто Prometheus ходит за метриками на каждый target
  scrape_interval: 15s
  # как долго ждать ответа, прежде чем считать запрос неуспешным
  scrape_timeout: 10s

# Список "джоб" — групп таргетов, которые опрашиваются одинаково
scrape_configs:
  # имя джобы — произвольное, оно попадёт в метрику job="..."
  - job_name: "prometheus"
    # адреса опроса: прометеус умеет мониторить сам себя —
    # это идеальный первый таргет, чтобы проверить связку
    static_configs:
      - targets: ["prometheus:9090"]
