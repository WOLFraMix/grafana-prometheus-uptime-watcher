services:
  # наше приложение: собирается из локального Dockerfile
  app:
    build: .
    ports:
      - "8080:8080"
    restart: unless-stopped
    environment:
      TARGETS: "https://example.com,https://go.dev,https://stepik.org/learn"
      CHECK_INTERVAL: "10s"

  prometheus:
    image: prom/prometheus:v2.53.0
    # Проброс конфига: физический файл в папке prometheus/
    # попадает внутрь контейнера по пути, который ожидает Prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    # Официальный образ ждёт конфиг по умолчанию именно там,
    # поэтому command можно не переопределять
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - prometheus
    volumes:
      - grafana-data:/var/lib/grafana

# Именованные тома: живут вне контейнеров,
# переживают down/up, пересоздание и пересборку
volumes:
  prometheus-data:
  grafana-data:
